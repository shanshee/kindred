<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kindred — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --bg-canvas: #fafaf9;
    --surface: #ffffff;
    --surface-2: #f4f4f2;
    --border: rgba(15, 17, 21, 0.08);
    --border-strong: rgba(15, 17, 21, 0.16);
    --fg: #15171b;
    --fg-muted: rgba(21, 23, 27, 0.55);
    --accent: #3b6cf5;
    --accent-soft: rgba(59, 108, 245, 0.10);
    --shadow-1: 0 1px 0 rgba(0,0,0,.02), 0 1px 2px rgba(0,0,0,.03);
    --shadow-2: 0 4px 14px -4px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-canvas);
    -webkit-font-smoothing: antialiased;
  }
  kbd, code { font-family: 'Geist Mono', ui-monospace, monospace; }
  button { font-family: inherit; }

  .ds-page { max-width: 1100px; margin: 0 auto; padding: 56px 40px 96px; }
  .ds-h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
  .ds-sub { font-size: 13.5px; color: var(--fg-muted); margin: 0 0 40px; }
  .ds-section { margin-top: 56px; }
  .ds-section h2 {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--fg-muted); margin: 0 0 14px; padding-bottom: 10px;
    border-bottom: .5px solid var(--border);
  }
  .ds-section h3 {
    font-size: 13px; font-weight: 500; letter-spacing: -.005em;
    color: var(--fg); margin: 22px 0 10px;
  }
  .ds-grid { display: grid; gap: 12px; }
  .ds-card {
    background: var(--surface);
    border: .5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow-1);
  }
  .ds-meta {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10.5px; color: var(--fg-muted); margin-top: 6px;
  }
  .ds-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="mock-art.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="view-workspace.jsx"></script>

<script type="text/babel">
// ── Design system showcase ──────────────────────────────────────────────────
// Loads the real primitives so this page stays in sync with the app.

const COLOR_TOKENS = [
  { name: '--bg',            sample: '#ffffff',                    note: 'page background' },
  { name: '--bg-canvas',     sample: '#fafaf9',                    note: 'main canvas behind cards' },
  { name: '--surface',       sample: '#ffffff',                    note: 'cards, popovers' },
  { name: '--surface-2',     sample: '#f4f4f2',                    note: 'subtle fills, hover' },
  { name: '--border',        sample: 'rgba(15,17,21,.08)',         note: '0.5px hairline default' },
  { name: '--border-strong', sample: 'rgba(15,17,21,.16)',         note: 'hover/focus borders' },
  { name: '--fg',            sample: '#15171b',                    note: 'primary text' },
  { name: '--fg-muted',      sample: 'rgba(21,23,27,.55)',         note: 'secondary text' },
  { name: '--accent',        sample: '#3b6cf5',                    note: 'links, primary actions' },
  { name: '--accent-soft',   sample: 'rgba(59,108,245,.10)',       note: 'accent fills' },
];

const TYPE_SPECS = [
  { token: 'display',  size: 28, weight: 600, tracking: '-0.02em', sample: 'Kindred' },
  { token: 'heading',  size: 18, weight: 600, tracking: '-0.01em', sample: 'Aria — Mobile App' },
  { token: 'body',     size: 14, weight: 400, tracking: '0',        sample: 'Tightened hero spacing.' },
  { token: 'body-md',  size: 13, weight: 500, tracking: '-0.005em', sample: 'Workspace' },
  { token: 'meta',     size: 12, weight: 400, tracking: '0',        sample: 'Updated 2h ago' },
  { token: 'caption',  size: 11, weight: 500, tracking: '0',        sample: 'In review' },
  { token: 'eyebrow',  size: 10, weight: 600, tracking: '0.06em',   sample: 'ACTIVE PROJECTS', upper: true },
];

const RADII = [
  { token: '4',   note: 'KindTag' },
  { token: '6',   note: 'compact buttons' },
  { token: '7',   note: 'nav items, icon btns' },
  { token: '8',   note: 'primary buttons, search input' },
  { token: '10',  note: 'thumbnails, storage card' },
  { token: '12',  note: 'popovers' },
  { token: '14',  note: 'FileCard' },
  { token: '999', note: 'pills, toasts, dots' },
];

const SHADOWS = [
  { token: '--shadow-1', value: '0 1px 0 rgba(0,0,0,.02), 0 1px 2px rgba(0,0,0,.03)', note: 'cards at rest' },
  { token: '--shadow-2', value: '0 4px 14px -4px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.05)', note: 'hover, popovers' },
  { token: 'drag',       value: '0 18px 50px -12px rgba(0,0,0,.25), 0 0 0 1px var(--accent)', note: 'dragged file ghost' },
  { token: 'toast',      value: '0 12px 30px -8px rgba(0,0,0,.35)',  note: 'pill toast' },
];

const ICON_NAMES = [
  'home','files','workspace','projects','shared','search','plus','bell','settings',
  'comment','pin','draw','highlight','cursor','download','eye','share','check',
  'arrow-left','more','clock','link','chevron-r','chevron-d','sparkle','upload','folder',
];

// ── Subsections ─────────────────────────────────────────────────────────────

function Swatch({ name, sample, note }) {
  return (
    <div className="ds-card" style={{ display: 'flex', gap: 12, alignItems: 'center', padding: 10 }}>
      <div style={{
        width: 44, height: 44, borderRadius: 8,
        background: sample,
        boxShadow: 'inset 0 0 0 .5px rgba(0,0,0,.08)',
        flexShrink: 0,
      }} />
      <div style={{ minWidth: 0, flex: 1 }}>
        <div style={{ fontFamily: 'Geist Mono', fontSize: 11.5, fontWeight: 500 }}>{name}</div>
        <div style={{ fontSize: 11, color: 'var(--fg-muted)', marginTop: 2 }}>{note}</div>
        <div style={{ fontFamily: 'Geist Mono', fontSize: 10.5, color: 'var(--fg-muted)', marginTop: 2 }}>{sample}</div>
      </div>
    </div>
  );
}

function ColorTokens() {
  return (
    <div className="ds-grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))' }}>
      {COLOR_TOKENS.map(t => <Swatch key={t.name} {...t} />)}
    </div>
  );
}

function TypeRamp() {
  return (
    <div className="ds-card" style={{ padding: 0, overflow: 'hidden' }}>
      {TYPE_SPECS.map((s, i) => (
        <div key={s.token} style={{
          display: 'flex', alignItems: 'baseline', gap: 16,
          padding: '14px 16px',
          borderTop: i === 0 ? 0 : '.5px solid var(--border)',
        }}>
          <div style={{
            width: 90, flexShrink: 0,
            fontFamily: 'Geist Mono', fontSize: 11, color: 'var(--fg-muted)',
          }}>{s.token}</div>
          <div style={{
            flex: 1,
            fontSize: s.size, fontWeight: s.weight, letterSpacing: s.tracking,
            textTransform: s.upper ? 'uppercase' : 'none',
            color: s.token === 'eyebrow' ? 'var(--fg-muted)' : 'var(--fg)',
          }}>{s.sample}</div>
          <div style={{
            fontFamily: 'Geist Mono', fontSize: 10.5, color: 'var(--fg-muted)',
            whiteSpace: 'nowrap',
          }}>{s.size}px / {s.weight}</div>
        </div>
      ))}
    </div>
  );
}

function RadiiGrid() {
  return (
    <div className="ds-grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))' }}>
      {RADII.map(r => (
        <div key={r.token} className="ds-card" style={{ padding: 12, textAlign: 'center' }}>
          <div style={{
            margin: '4px auto 10px', width: 64, height: 64,
            borderRadius: r.token === '999' ? 999 : Number(r.token),
            background: 'var(--surface-2)',
            border: '.5px solid var(--border)',
          }} />
          <div style={{ fontFamily: 'Geist Mono', fontSize: 11.5, fontWeight: 500 }}>
            {r.token === '999' ? '∞' : r.token + 'px'}
          </div>
          <div style={{ fontSize: 11, color: 'var(--fg-muted)', marginTop: 2 }}>{r.note}</div>
        </div>
      ))}
    </div>
  );
}

function ShadowsGrid() {
  return (
    <div className="ds-grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' }}>
      {SHADOWS.map(s => (
        <div key={s.token} style={{ padding: 24 }}>
          <div style={{
            height: 80, borderRadius: 12,
            background: 'var(--surface)',
            border: '.5px solid var(--border)',
            boxShadow: s.value,
          }} />
          <div style={{ fontFamily: 'Geist Mono', fontSize: 11.5, fontWeight: 500, marginTop: 12 }}>{s.token}</div>
          <div style={{ fontSize: 11, color: 'var(--fg-muted)', marginTop: 2 }}>{s.note}</div>
        </div>
      ))}
    </div>
  );
}

function IconGrid() {
  return (
    <div className="ds-grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(110px, 1fr))' }}>
      {ICON_NAMES.map(n => (
        <div key={n} className="ds-card" style={{
          padding: 14, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 10,
          minHeight: 84,
        }}>
          <Icon name={n} size={20} stroke={1.5} />
          <div style={{ fontFamily: 'Geist Mono', fontSize: 10.5, color: 'var(--fg-muted)' }}>{n}</div>
        </div>
      ))}
    </div>
  );
}

function ButtonsShowcase() {
  return (
    <div className="ds-card" style={{ padding: 22 }}>
      <div className="ds-row">
        <button style={primaryBtn}><Icon name="share" size={13} /> Share</button>
        <button style={ghostBtn}><Icon name="plus" size={13} /> Add file</button>
        <button style={iconBtnStyle()}><Icon name="bell" size={16} /></button>
        <button style={iconBtnStyle(true)}><Icon name="settings" size={16} /></button>
        <button style={{ ...primaryBtn, height: 30, padding: '0 12px', fontSize: 12 }}>
          <Icon name="check" size={12} /> Approve
        </button>
        <button style={{ ...ghostBtn, height: 28, padding: '0 10px', fontSize: 12 }}>
          Cancel
        </button>
      </div>
      <div className="ds-meta" style={{ marginTop: 14 }}>
        primaryBtn · ghostBtn · iconBtnStyle() · iconBtnStyle(active)
      </div>
    </div>
  );
}

function StatusShowcase() {
  return (
    <div className="ds-card" style={{ padding: 22 }}>
      <div className="ds-row">
        {Object.keys(STATUS_META).map(k => <StatusPill key={k} status={k} />)}
      </div>
      <div className="ds-row" style={{ marginTop: 12 }}>
        {Object.keys(STATUS_META).map(k => <StatusPill key={k} status={k} size="md" />)}
      </div>
      <div className="ds-meta" style={{ marginTop: 14 }}>
        StatusPill · sizes: sm (default), md
      </div>
    </div>
  );
}

function KindShowcase() {
  return (
    <div className="ds-card" style={{ padding: 22 }}>
      <div className="ds-row">
        {Object.keys(KIND_META).map(k => <KindTag key={k} kind={k} />)}
      </div>
      <div className="ds-meta" style={{ marginTop: 14 }}>KindTag · color per file format</div>
    </div>
  );
}

function AvatarShowcase() {
  return (
    <div className="ds-card" style={{ padding: 22 }}>
      <h3 style={{ margin: '0 0 10px', fontSize: 12, fontWeight: 500, color: 'var(--fg-muted)' }}>Sizes</h3>
      <div className="ds-row" style={{ marginBottom: 18 }}>
        {[18, 24, 28, 32, 40].map(s => <Avatar key={s} user={TEAM[1]} size={s} />)}
      </div>
      <h3 style={{ margin: '0 0 10px', fontSize: 12, fontWeight: 500, color: 'var(--fg-muted)' }}>States</h3>
      <div className="ds-row" style={{ marginBottom: 18 }}>
        <Avatar user={TEAM[1]} size={32} />
        <Avatar user={TEAM[2]} size={32} />
        <Avatar user={TEAM[3]} size={32} ring />
      </div>
      <h3 style={{ margin: '0 0 10px', fontSize: 12, fontWeight: 500, color: 'var(--fg-muted)' }}>Stack</h3>
      <div className="ds-row">
        <div style={{ display: 'flex' }}>
          {TEAM.slice(0, 5).map((u, i) => (
            <Avatar key={u.id} user={u} size={28} stack={i > 0} />
          ))}
        </div>
      </div>
      <div className="ds-meta" style={{ marginTop: 14 }}>
        Avatar · online dot, ring, stack offset
      </div>
    </div>
  );
}

function FileCardShowcase() {
  return (
    <div className="ds-grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' }}>
      <div>
        <FileCard file={FILES[0]} draggable={false} />
        <div className="ds-meta">comfortable · default</div>
      </div>
      <div>
        <FileCard file={FILES[2]} density="compact" draggable={false} />
        <div className="ds-meta">compact density</div>
      </div>
      <div>
        <FileCard file={FILES[4]} draggable={false} dragging />
        <div className="ds-meta">dragging state</div>
      </div>
      <div>
        <FileCard file={FILES[3]} draggable={false} compact />
        <div className="ds-meta">compact variant (no owner)</div>
      </div>
    </div>
  );
}

function ChromeShowcase() {
  return (
    <div className="ds-card" style={{ padding: 16 }}>
      <h3 style={{ margin: '0 0 10px', fontSize: 12, fontWeight: 500, color: 'var(--fg-muted)' }}>
        Search input (sidebar)
      </h3>
      <button style={{
        display: 'flex', alignItems: 'center', gap: 8,
        padding: '8px 10px', borderRadius: 8,
        background: 'var(--surface-2)',
        border: '.5px solid var(--border)',
        color: 'var(--fg-muted)', fontSize: 12, cursor: 'text',
        width: 220,
      }}>
        <Icon name="search" size={14} />
        <span style={{ flex: 1, textAlign: 'left' }}>Search files</span>
        <kbd style={{
          fontSize: 10, padding: '1px 5px', borderRadius: 3,
          background: 'var(--bg)', border: '.5px solid var(--border)',
          fontFamily: 'inherit', color: 'var(--fg-muted)',
        }}>⌘K</kbd>
      </button>

      <h3 style={{ margin: '22px 0 10px', fontSize: 12, fontWeight: 500, color: 'var(--fg-muted)' }}>
        Toast
      </h3>
      <div style={{
        display: 'inline-flex', alignItems: 'center', gap: 8,
        padding: '10px 16px 10px 14px', borderRadius: 999,
        background: 'var(--fg)', color: 'var(--bg)',
        fontSize: 12.5, fontWeight: 500,
        boxShadow: '0 12px 30px -8px rgba(0,0,0,.35)',
      }}>
        <Icon name="check" size={13} stroke={2.2} />
        Added "Hero — Concept B" to workspace
      </div>

      <h3 style={{ margin: '22px 0 10px', fontSize: 12, fontWeight: 500, color: 'var(--fg-muted)' }}>
        Breadcrumb
      </h3>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ fontSize: 13, color: 'var(--fg-muted)' }}>Aria — Mobile App</span>
        <Icon name="chevron-r" size={12} style={{ opacity: .35 }} />
        <span style={{ fontSize: 13, color: 'var(--fg-muted)' }}>Workspace</span>
        <Icon name="chevron-r" size={12} style={{ opacity: .35 }} />
        <span style={{ fontSize: 13, fontWeight: 500, color: 'var(--fg)' }}>Aria — Hero Frame</span>
      </div>
    </div>
  );
}

// ── Page ────────────────────────────────────────────────────────────────────

function Section({ title, desc, children }) {
  return (
    <section className="ds-section">
      <h2>{title}</h2>
      {desc && <p style={{ fontSize: 12.5, color: 'var(--fg-muted)', margin: '-6px 0 14px' }}>{desc}</p>}
      {children}
    </section>
  );
}

function App() {
  return (
    <div className="ds-page">
      <h1 className="ds-h1">Kindred Design System</h1>
      <p className="ds-sub">
        Tokens, primitives, and patterns powering the workspace prototype.
        Live reference — pulls from the same .jsx modules as the app.
      </p>

      <Section title="Color tokens" desc="CSS custom properties on :root. Accent is rebindable via Tweaks.">
        <ColorTokens />
      </Section>

      <Section title="Typography" desc="Geist for UI, Geist Mono for code/kbd. Tight tracking on display sizes.">
        <TypeRamp />
      </Section>

      <Section title="Radius" desc="Hairline 0.5px borders pair with these radii.">
        <RadiiGrid />
      </Section>

      <Section title="Elevation">
        <ShadowsGrid />
      </Section>

      <Section title="Iconography" desc="Stroke-based. 16/20px friendly. Default stroke 1.5.">
        <IconGrid />
      </Section>

      <Section title="Buttons">
        <ButtonsShowcase />
      </Section>

      <Section title="Status pills" desc="From STATUS_META in data.jsx.">
        <StatusShowcase />
      </Section>

      <Section title="Kind tags" desc="One color per file format. From KIND_META.">
        <KindShowcase />
      </Section>

      <Section title="Avatars">
        <AvatarShowcase />
      </Section>

      <Section title="File card" desc="Densities, dragging, compact variant.">
        <FileCardShowcase />
      </Section>

      <Section title="Chrome & feedback" desc="Search trigger, toast, breadcrumb.">
        <ChromeShowcase />
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
