<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kindred — Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --bg-canvas: #fafaf9;
    --surface: #ffffff;
    --surface-2: #f4f4f2;
    --border: rgba(15, 17, 21, 0.06);
    --border-strong: rgba(15, 17, 21, 0.12);
    --fg: #15171b;
    --fg-muted: rgba(21, 23, 27, 0.55);
    --accent: #3b6cf5;
    --accent-soft: rgba(59, 108, 245, 0.10);
    --shadow-1: 0 1px 0 rgba(0,0,0,.02), 0 1px 2px rgba(0,0,0,.03);
    --shadow-2: 0 4px 14px -4px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  kbd, code { font-family: 'Geist Mono', ui-monospace, monospace; }
  button { font-family: inherit; }

  @keyframes fadeOut {
    0% { opacity: 0; transform: translateY(-2px); }
    20% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-2px); }
  }
  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    50% { box-shadow: 0 0 0 4px transparent; opacity: .85; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn .25s ease both; }
  @keyframes fadeInOpacity {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .fade-in-noxform { animation: fadeInOpacity .2s ease both; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="mock-art.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="cloud-search.jsx"></script>
<script type="text/babel" src="view-workspace.jsx"></script>
<script type="text/babel" src="view-personal.jsx"></script>
<script type="text/babel" src="view-preview.jsx"></script>
<script type="text/babel" src="view-share.jsx"></script>

<!-- Cache-bust the .jsx sources on every load. The browser otherwise
     serves stale compiled modules, which can mismatch against this HTML
     (e.g. a new component referenced before its cached file defines it).
     Runs during parsing — before Babel processes scripts on DOMContentLoaded. -->
<script>
  (function () {
    var v = Date.now();
    var tags = document.querySelectorAll('script[type="text/babel"][src]');
    for (var i = 0; i < tags.length; i++) {
      tags[i].src = tags[i].getAttribute('src').split('?')[0] + '?v=' + v;
    }
  })();
</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3b6cf5",
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = React.useState('workspace');
  const [activePerson, setActivePerson] = React.useState(null);
  const [activeFile, setActiveFile] = React.useState(null);
  // Where to return when leaving the preview — captured at open time so the
  // back button and breadcrumbs reflect the actual navigation path.
  const [previewFrom, setPreviewFrom] = React.useState('workspace');
  // Live workspace files — starts as the FILES seed; mutations (assign, add) flow through here.
  const [files, setFiles] = React.useState(() => FILES.map(f => ({ ...f })));
  const [addedCloudFiles, setAddedCloudFiles] = React.useState([]); // for "Recent" highlight
  const [dragState, setDragState] = React.useState({ active: false, fileId: null, cloudFile: null, x: 0, y: 0, hoverPersonId: null });
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [pendingAssign, setPendingAssign] = React.useState(null); // cloud file awaiting teammate pick
  const searchBtnRef = React.useRef(null);
  const [searchAnchor, setSearchAnchor] = React.useState(null);
  const fileInputRef = React.useRef(null);
  const [assignModalFile, setAssignModalFile] = React.useState(null); // cloud file pending assignment

  // Keep activeFile in sync with files state (so its owner badge updates after reassign)
  React.useEffect(() => {
    if (!activeFile) return;
    const fresh = files.find(f => f.id === activeFile.id);
    if (fresh && fresh !== activeFile) setActiveFile(fresh);
  }, [files, activeFile]);

  const openSearch = () => {
    const r = searchBtnRef.current?.getBoundingClientRect();
    // Anchor below the search input so the popover hangs from the global nav.
    setSearchAnchor(r ? { left: r.left, bottom: r.bottom } : null);
    setSearchOpen(true);
  };

  // ⌘K
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault(); openSearch();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const startCloudDrag = (file, ev) => {
    setDragState({ active: true, fileId: null, cloudFile: file, x: ev.clientX, y: ev.clientY, hoverPersonId: null });
    const move = (e) => setDragState(s => s.active ? { ...s, x: e.clientX, y: e.clientY } : s);
    const up = (e) => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      setDragState(s => {
        if (s.hoverPersonId) {
          importCloudFile(file, s.hoverPersonId);
          const person = TEAM.find(p => p.id === s.hoverPersonId);
          flashToast(`Added "${file.title}" — assigned to ${person?.isMe ? 'You' : person?.name.split(' ')[0]}`);
        } else {
          importCloudFile(file);
          flashToast(`Added "${file.title}" to workspace`);
        }
        return { active: false, fileId: null, cloudFile: null, x: 0, y: 0, hoverPersonId: null };
      });
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  const flashToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  };

  // ── Real file uploads ──────────────────────────────────────────────────
  // Upload button opens a hidden file picker; selected JPG/PNG/PDF files
  // become real entries in the workspace with object-URL previews.
  const formatFileSize = (bytes) => {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  };

  const openFilePicker = () => fileInputRef.current?.click();

  const handleFileUpload = (e) => {
    const fileList = [...(e.target.files || [])];
    if (!fileList.length) return;

    const newFiles = fileList.map((file) => {
      const objectUrl = URL.createObjectURL(file);
      const ext = (file.name.split('.').pop() || '').toUpperCase();
      const kindMap = { JPG: 'JPG', JPEG: 'JPG', PNG: 'PNG', PDF: 'PDF' };
      const kind = kindMap[ext] || 'FILE';
      const title = file.name.replace(/\.[^.]+$/, '');
      const isImage = (file.type || '').startsWith('image/');
      return {
        id: 'upl-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        title,
        kind,
        size: formatFileSize(file.size),
        owner: 'me',
        status: 'draft',
        comments: 0,
        unread: 0,
        version: 'v1',
        updated: 'just now',
        // CSS background shorthand — real image fills the thumb area;
        // falls back to a calm PDF-themed gradient otherwise.
        thumb: isImage
          ? `#0f141c center / cover no-repeat url("${objectUrl}")`
          : 'linear-gradient(135deg, #fde2dc 0%, #f8b8aa 55%, #ec8775 100%)',
        accent: isImage ? 'hsl(218 10% 50%)' : 'hsl(8 70% 60%)',
        _dataUrl: objectUrl,
        _mimeType: file.type,
      };
    });

    setFiles((prev) => [...newFiles, ...prev]);
    setAddedCloudFiles((prev) => [...newFiles, ...prev]);
    flashToast(`Added ${newFiles.length} file${newFiles.length === 1 ? '' : 's'}`);

    // Reset so the same file can be re-uploaded
    e.target.value = '';
  };

  const handleNewFile = () => {
    // No real "new file" canvas in the prototype — point the user to upload.
    flashToast('Tip: drag files into the workspace or use Upload');
  };

  // ── Mutations ────────────────────────────────────────────────────────────
  // Assign an existing workspace file to a teammate — or to the shared
  // "Design Team" pool (personId === 'pool'), which un-claims it.
  const assignFileToPerson = (fileId, personId) => {
    setFiles(prev => prev.map(f => f.id === fileId ? { ...f, owner: personId, updated: 'just now' } : f));
    const f = files.find(x => x.id === fileId);
    if (!f) return;
    if (personId === 'pool') {
      flashToast(`"${f.title}" → Design Team queue`);
      return;
    }
    const p = TEAM.find(x => x.id === personId);
    if (p) flashToast(`"${f.title}" → ${p.isMe ? 'You' : p.name.split(' ')[0]}`);
  };

  // Apply arbitrary updates to a file (status, owner, etc.) and bump its
  // updated timestamp so it surfaces in recent activity.
  const updateFile = (fileId, updates) => {
    setFiles(prev => prev.map(f => f.id === fileId
      ? { ...f, ...updates, updated: 'just now' }
      : f));
  };

  // Materialize a cloud file into the workspace. Optional ownerId assigns
  // directly; optional status (e.g. 'review') marks it on import.
  const importCloudFile = (cloudFile, ownerId, status) => {
    // Pick a kind→thumb gradient & accent from the existing palette.
    const seed = FILES.find(f => f.id === cloudFile.thumbArt) || FILES[0];
    const newFile = {
      id: 'c-' + cloudFile.id + '-' + Date.now(),
      title: cloudFile.title,
      kind: cloudFile.kind, size: cloudFile.size,
      owner: ownerId || 'me',
      status: status || 'draft', comments: 0, version: 'v1', updated: 'just now',
      thumb: seed.thumb, accent: seed.accent, dark: seed.dark,
      _thumbArt: cloudFile.thumbArt,
    };
    setFiles(prev => [newFile, ...prev]);
    setAddedCloudFiles(prev => [newFile, ...prev]);
    return newFile;
  };

  const addCloudFile = (f) => {
    setSearchOpen(false); setPickerOpen(false);
    importCloudFile(f);
    flashToast(`Added "${f.title}" to workspace`);
  };
  // "Assign…" on a cloud file opens the Assign modal (person or team).
  const assignCloudFile = (f) => {
    setSearchOpen(false); setPickerOpen(false);
    setAssignModalFile(f);
  };

  // Assign the pending cloud file to a person — imports it into the
  // workspace already in review and owned by that teammate.
  const assignToPerson = (personId) => {
    if (!assignModalFile) return;
    const f = importCloudFile(assignModalFile, personId, 'review');
    const p = TEAM.find(x => x.id === personId);
    flashToast(`Sent to ${p?.isMe ? 'you' : p?.name.split(' ')[0]} for review`);
    setAssignModalFile(null);
  };

  // Assign to a team — load-balances onto the member with the lightest
  // review queue, so work distributes naturally.
  const assignToTeam = (teamId) => {
    if (!assignModalFile) return;
    const team = TEAMS.find(t => t.id === teamId);
    if (!team) return;
    const load = (id) => files.filter(x => x.owner === id && x.status === 'review').length;
    const chosen = [...team.members].sort((a, b) => load(a) - load(b))[0];
    const f = importCloudFile(assignModalFile, chosen, 'review');
    const p = TEAM.find(x => x.id === chosen);
    flashToast(`Assigned to ${team.name} — routed to ${p?.isMe ? 'you' : p?.name.split(' ')[0]}`);
    setAssignModalFile(null);
  };

  // Apply tweaks via CSS vars
  React.useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--accent', t.accent);
    // Compute a soft version of accent
    const r = parseInt(t.accent.slice(1, 3), 16);
    const g = parseInt(t.accent.slice(3, 5), 16);
    const b = parseInt(t.accent.slice(5, 7), 16);
    root.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.10)`);
  }, [t.accent]);

  const goToPerson = (p) => { setActivePerson(p); setView('personal'); };
  const goToFile   = (f) => {
    setPreviewFrom(view === 'personal' && activePerson ? 'personal' : 'workspace');
    setActiveFile(f); setView('preview');
  };
  const goToShare  = ()  => { setView('share'); };
  const goWorkspace = () => { setView('workspace'); };
  const backFromPreview = () => {
    if (previewFrom === 'personal' && activePerson) setView('personal');
    else setView('workspace');
  };

  const draggedFile = dragState.active && dragState.fileId ? FILES.find(f => f.id === dragState.fileId) : null;
  const draggedCloud = dragState.active && dragState.cloudFile ? dragState.cloudFile : null;

  // Crumbs by view
  let crumbs = [];
  if (view === 'workspace') {
    crumbs = [{ label: 'Aria — Mobile App' }, { label: 'Workspace' }];
  } else if (view === 'personal' && activePerson) {
    crumbs = [
      { label: 'Aria — Mobile App' },
      { label: 'Workspace', onClick: goWorkspace },
      { label: activePerson.name },
    ];
  } else if (view === 'preview' && activeFile) {
    crumbs = [
      { label: 'Aria — Mobile App' },
      { label: 'Workspace', onClick: goWorkspace },
    ];
    if (previewFrom === 'personal' && activePerson) {
      crumbs.push({ label: activePerson.name, onClick: () => setView('personal') });
    }
    crumbs.push({ label: activeFile.title });
  } else if (view === 'share' && activeFile) {
    crumbs = [
      { label: 'Aria — Mobile App' },
      { label: activeFile.title, onClick: () => setView('preview') },
      { label: 'Share' },
    ];
  } else if (view === 'share') {
    crumbs = [{ label: 'Shared' }, { label: 'External delivery' }];
  }

  // Default share file
  const shareFile = activeFile || FILES[2]; // f3 is approved

  // Top right cluster — varies per view
  const topRight = view === 'preview' ? null : (
    <button style={{
      ...primaryBtn, height: 30, padding: '0 12px', fontSize: 12,
    }}><Icon name="share" size={13} /> Share</button>
  );

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <input ref={fileInputRef} type="file"
        accept="image/jpeg,image/png,application/pdf"
        multiple
        onChange={handleFileUpload}
        style={{ display: 'none' }} />
      <GlobalNav onOpenSearch={openSearch} searchBtnRef={searchBtnRef}
        onUpload={openFilePicker} onNewFile={handleNewFile}
        right={topRight} />

      <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>
        <Sidebar view={view} setView={(v) => {
          if (v === 'workspace') goWorkspace();
          else if (v === 'share') { setActiveFile(FILES[2]); setView('share'); }
        }} density={t.density} />

        <main style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          minWidth: 0, minHeight: 0,
          background: 'var(--bg-canvas)',
        }}>
        {/* Topbar removed — each page handles its own context (eyebrow,
            back button, etc.) so the GlobalNav reads as the only system
            band. Crumbs are still computed above for any future reuse. */}

        <div key={view} className="fade-in" style={{
          flex: 1, display: 'flex', minHeight: 0, minWidth: 0,
        }}>
          {view === 'workspace' && (
            <WorkspaceView density={t.density}
              onPersonClick={goToPerson} onFileOpen={goToFile}
              dragState={dragState} setDragState={setDragState}
              onBrowseFiles={() => setPickerOpen(true)}
              files={files} addedCloudFiles={addedCloudFiles}
              onAssignFile={assignFileToPerson}
              pendingAssign={pendingAssign}
              onConfirmPendingAssign={(personId) => {
                if (!pendingAssign) return;
                const f = importCloudFile(pendingAssign, personId);
                const p = TEAM.find(x => x.id === personId);
                flashToast(`Added "${f.title}" — assigned to ${p?.isMe ? 'You' : p?.name.split(' ')[0]}`);
                setPendingAssign(null);
              }}
              onCancelPendingAssign={() => setPendingAssign(null)} />
          )}
          {view === 'personal' && activePerson && (
            <PersonalView person={activePerson} density={t.density}
              onBack={goWorkspace} onFileOpen={goToFile}
              dragState={dragState} setDragState={setDragState}
              files={files} onAssignFile={assignFileToPerson} />
          )}
          {view === 'preview' && activeFile && (
            <PreviewView file={activeFile} density={t.density}
              onBack={backFromPreview} onShare={goToShare}
              onUpdateFile={(updates) => {
                updateFile(activeFile.id, updates);
                const verb = updates.status
                  ? (updates.status === 'review' ? 'Sent for review'
                    : updates.status === 'final' ? 'Marked as final'
                    : updates.status === 'approved' ? 'Approved'
                    : 'Updated')
                  : 'Updated';
                if (updates.status === 'review' && updates.owner && updates.owner !== 'me') {
                  const p = TEAM.find(x => x.id === updates.owner);
                  flashToast(`Sent to ${p?.name.split(' ')[0]} for review`);
                } else {
                  flashToast(verb);
                }
              }} />
          )}
          {view === 'share' && (
            <ShareView file={shareFile} onBack={goWorkspace} />
          )}
        </div>
        </main>
      </div>

      {/* Drag ghost */}
      {dragState.active && draggedFile && (
        <div style={{
          position: 'fixed', left: dragState.x, top: dragState.y,
          transform: 'translate(-30%, -40%) rotate(-3deg)',
          width: 220, pointerEvents: 'none', zIndex: 1000,
        }}>
          <FileCard file={draggedFile} dragging={true} draggable={false} compact />
        </div>
      )}
      {dragState.active && draggedCloud && (
        <div style={{
          position: 'fixed', left: dragState.x, top: dragState.y,
          transform: 'translate(-30%, -40%) scale(1.02) rotate(-3deg)',
          width: 200, pointerEvents: 'none', zIndex: 1000,
          background: 'var(--surface)',
          borderRadius: 12,
          padding: 10,
          boxShadow: '0 18px 50px -12px rgba(0,0,0,.28), 0 0 0 1px var(--accent)',
        }}>
          <CloudThumb file={draggedCloud} height={86} rounded={8} />
          <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
            <div style={{
              width: 4, height: 4, borderRadius: 999,
              background: 'var(--accent)', flexShrink: 0,
            }}></div>
            <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--fg)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {draggedCloud.title}
            </div>
          </div>
          <div style={{ marginTop: 2, fontSize: 10.5, color: 'var(--fg-muted)' }}>
            From cloud · {draggedCloud.folder}
          </div>
        </div>
      )}

      <SearchPopover open={searchOpen} onClose={() => setSearchOpen(false)}
        anchorRect={searchAnchor}
        onAddFromCloud={addCloudFile} onAssignFromCloud={assignCloudFile}
        onOpenFile={goToFile}
        onCloudDragStart={startCloudDrag} />

      <FilePickerModal open={pickerOpen} onClose={() => setPickerOpen(false)}
        onAddFromCloud={addCloudFile} onAssignFromCloud={assignCloudFile}
        onCloudDragStart={startCloudDrag} />

      {assignModalFile && (
        <AssignModal file={assignModalFile} files={files}
          onAssignPerson={assignToPerson}
          onAssignTeam={assignToTeam}
          onClose={() => setAssignModalFile(null)} />
      )}
      {toast && (
        <div className="fade-in" style={{
          position: 'fixed', bottom: 24, left: '50%',
          transform: 'translateX(-50%)',
          padding: '10px 16px 10px 14px', borderRadius: 999,
          background: 'var(--fg)', color: 'var(--bg)',
          fontSize: 12.5, fontWeight: 500,
          display: 'inline-flex', alignItems: 'center', gap: 8,
          boxShadow: '0 12px 30px -8px rgba(0,0,0,.35)',
          zIndex: 980,
        }}>
          <Icon name="check" size={13} stroke={2.2} />
          {toast}
        </div>
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakColor label="Accent color" value={t.accent}
          onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
          options={['compact', 'comfortable']}
          onChange={(v) => setTweak('density', v)} />
        <TweakSection label="Jump to view" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
          <TweakButton secondary label="Workspace" onClick={goWorkspace} />
          <TweakButton secondary label="Personal" onClick={() => goToPerson(TEAM[1])} />
          <TweakButton secondary label="Preview" onClick={() => goToFile(FILES[0])} />
          <TweakButton secondary label="Share" onClick={() => { setActiveFile(FILES[2]); setView('share'); }} />
        </div>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
